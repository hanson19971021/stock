<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock From Zero - 真實資料網頁選股系統</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-red: #ff5252;
            --accent-green: #4caf50;
            --primary-blue: #2196f3;
            --border-color: #333;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        .btn-fetch { background-color: var(--primary-blue); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-fetch:disabled { background-color: #555; }
        table { width: 100%; border-collapse: collapse; background-color: var(--card-bg); border-radius: 8px; overflow: hidden; margin-top: 20px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: #252525; color: #888; }
        .price-up { color: var(--accent-red); font-weight: bold; }
        .signal-buy { background-color: #b71c1c; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
        .signal-wait { background-color: #f57f17; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
        .status-box { background-color: #1a1a1a; padding: 15px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Stock From Zero - 即時真實資料選股系統</h1>
        <button id="fetch-btn" class="btn-fetch" onclick="fetchRealStockData()">🔄 擷取即時真實股票資料</button>
    </header>

    <div class="status-box" id="status-text">
        狀態：等待執行...（請點擊上方按鈕，向開放 API 請求最新台股真實資料）
    </div>

    <table>
        <thead>
            <tr>
                <th>股票代碼</th>
                <th>最新真實收盤價</th>
                <th>34 MA (生命線)</th>
                <th>34 MA 走勢</th>
                <th>近5日成交張數</th>
                <th>型態/一過二判斷</th>
                <th>進場點建議</th>
                <th>出場/停損點建議</th>
                <th>操作訊號</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr><td colspan="9" style="text-align:center; color:#666;">尚未載入資料</td></tr>
        </tbody>
    </table>
</div>

<script>
// 監測目標熱門個股清單
const targetStocks = ["2330", "2317", "2454", "2603", "6213", "3021", "2033", "2483"];

async function fetchRealStockData() {
    const btn = document.getElementById('fetch-btn');
    const status = document.getElementById('status-text');
    const tbody = document.getElementById('stock-table-body');
    
    btn.disabled = true;
    tbody.innerHTML = '';
    
    // 取得 60 天前日期以計算 34 MA
    const endDate = new Date().toISOString().split('T')[0];
    const startDateObj = new Date();
    startDateObj.setDate(startDateObj.getDate() - 90);
    const startDate = startDateObj.toISOString().split('T')[0];

    status.innerText = `正在連線 FinMind API 抓取最新真實股票數據 (${startDate} ~ ${endDate})...`;

    for (let code of targetStocks) {
        try {
            status.innerText = `讀取中：個股 ${code}...`;
            const url = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${code}&start_date=${startDate}&end_date=${endDate}`;
            const response = await fetch(url);
            const resData = await response.json();
            
            if (resData.data && resData.data.length >= 35) {
                const prices = resData.data;
                const len = prices.length;
                
                // 最新真實資料
                const latest = prices[len - 1];
                const prev1 = prices[len - 2];
                const prev2 = prices[len - 3];
                
                // 計算最新 34 MA 與 5 天前 34 MA (判斷走勢)
                const slice34Current = prices.slice(len - 34, len);
                const ma34Current = slice34Current.reduce((acc, p) => acc + p.Close, 0) / 34;

                const slice34Prev = prices.slice(len - 39, len - 5);
                const ma34Prev = slice34Prev.reduce((acc, p) => acc + p.Close, 0) / 34;

                // 計算 5 日成交總量 (張數)
                const vol5d = Math.round(prices.slice(len - 5, len).reduce((acc, p) => acc + (p.Trading_Volume || 0), 0) / 1000);

                // 判斷 34MA 方向
                const isMa34Up = ma34Current > ma34Prev;

                // 判斷「一過二」(收盤價突破前兩日最高價)
                const maxPrev2High = Math.max(prev1.Max, prev2.Max);
                const isBreakTwo = latest.Close > maxPrev2High;

                // 計算前波近 10 日最低點作為停損參考
                const lowest10d = Math.min(...prices.slice(len - 10, len).map(p => p.Min));

                // 渲染至表格
                renderRow(code, latest.Close, ma34Current.toFixed(2), isMa34Up, vol5d, isBreakTwo, lowest10d, latest.Close > ma34Current);
            }
        } catch (e) {
            console.error(`讀取 ${code} 失敗`, e);
        }
    }

    status.innerText = `最新真實資料分析完成！資料更新時間：${new Date().toLocaleString()}`;
    btn.disabled = false;
}

function renderRow(code, price, ma34, isMa34Up, vol5d, isBreakTwo, lowest10d, isAboveMa34) {
    const tbody = document.getElementById('stock-table-body');
    const tr = document.createElement('tr');

    let signal = "";
    if (isAboveMa34 && isMa34Up && isBreakTwo) {
        signal = `<span class="signal-buy">起漲進場訊號 (一過二)</span>`;
    } else if (isAboveMa34 && isMa34Up) {
        signal = `<span class="signal-wait">多頭觀望 (等待轉折/一過二)</span>`;
    } else {
        signal = `<span style="color:#888;">不符合強勢條件</span>`;
    }

    tr.innerHTML = `
        <td><strong>${code}</strong></td>
        <td class="price-up">NT$ ${price}</td>
        <td>NT$ ${ma34}</td>
        <td style="color:${isMa34Up ? '#ff5252' : '#4caf50'}">${isMa34Up ? '↗ 上揚 (助漲)' : '↘ 下彎'}</td>
        <td>${vol5d.toLocaleString()} 張</td>
        <td>${isBreakTwo ? '已突破前2日高點' : '整理中'}</td>
        <td style="color:#ff5252;">${isBreakTwo ? `NT$ ${price} (起漲突破)` : '等待突破前2日最高價'}</td>
        <td style="color:#4caf50;">NT$ ${Math.min(lowest10d, parseFloat(ma34)).toFixed(1)} (跌破前低/34MA)</td>
        <td>${signal}</td>
    `;
    tbody.appendChild(tr);
}
</script>

</body>
</html>
