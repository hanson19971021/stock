<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock From Zero - 台股即時選股與策略分析系統</title>
    <!-- Chart.js 視覺化圖庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f141c;
            --card-bg: #1a212d;
            --card-border: #2a3447;
            --accent-pink: #ff2e93;
            --accent-yellow: #f59e0b;
            --up-green: #26a69a;
            --down-red: #ef5350;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            font-size: 14px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #3b82f6, var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: rgba(38, 166, 154, 0.15);
            color: var(--up-green);
            border: 1px solid var(--up-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-bar-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input-group {
            display: flex;
            align-items: center;
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 0 12px;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-input-group input {
            background: transparent;
            border: none;
            color: #fff;
            padding: 10px;
            width: 100%;
            outline: none;
        }

        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-pink {
            background: var(--accent-pink);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            gap: 20px;
        }

        @media (max-width: 1200px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
        }

        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        .filter-section {
            margin-bottom: 15px;
        }

        .filter-section label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .filter-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .filter-btn {
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .filter-btn.active {
            border-color: var(--accent-pink);
            color: var(--accent-pink);
            background: rgba(255, 46, 147, 0.1);
        }

        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .stock-item:hover, .stock-item.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tag-pattern {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-yellow);
        }

        .chart-container {
            position: relative;
            height: 380px;
            width: 100%;
            margin-bottom: 15px;
        }

        .adam-calculator {
            background: rgba(15, 20, 28, 0.6);
            border: 1px dashed var(--card-border);
            border-radius: 6px;
            padding: 12px;
            margin-top: 15px;
        }

        .adam-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .adam-input-group input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 6px 8px;
            border-radius: 4px;
            margin-top: 4px;
        }

        .adam-result {
            margin-top: 10px;
            padding: 8px;
            background: rgba(255, 46, 147, 0.15);
            border-radius: 4px;
            text-align: center;
            color: var(--accent-pink);
            font-weight: bold;
        }

        .basket-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .basket-box {
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 10px;
            min-height: 120px;
        }

        .basket-header {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <i class="fa-solid fa-chart-line fa-xl" style="color: var(--accent-pink);"></i>
            <h1>Stock From Zero 選股幫</h1>
        </div>
        <div class="status-badge">
            <i class="fa-solid fa-wifi"></i> FinMind API 連線已就緒
        </div>
    </div>

    <!-- 頂部即時台股搜尋與串接 -->
    <div class="search-bar-container">
        <div class="search-input-group">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
            <input type="text" id="stockSearchInput" placeholder="輸入台股代號 (例: 2330, 2603, 6104)...">
        </div>
        <button class="btn" onclick="fetchLiveStockData()"><i class="fa-solid fa-cloud-arrow-down"></i> 線上抓取數據 (FinMind)</button>
        <span style="color: var(--text-muted); font-size: 0.8rem;">自動試算 34MA 生命線與講義四種型態</span>
    </div>

    <div class="grid-layout">
        <!-- 左側：篩選器與股票選單 -->
        <div class="panel">
            <div class="panel-title"><i class="fa-solid fa-filter"></i> 講義核心整理型態</div>
            
            <div class="filter-section">
                <label>型態過濾</label>
                <div class="filter-options">
                    <div class="filter-btn active" onclick="setPatternFilter('all')">全部類型</div>
                    <div class="filter-btn" onclick="setPatternFilter('橫盤整理')">橫盤整理</div>
                    <div class="filter-btn" onclick="setPatternFilter('前高之上')">前高之上</div>
                    <div class="filter-btn" onclick="setPatternFilter('前低之上')">前低之上</div>
                </div>
            </div>

            <div class="panel-title" style="margin-top: 20px;"><i class="fa-solid fa-list"></i> 股票清單</div>
            <div class="stock-list" id="stockList">
                <!-- 動態注入股票項目 -->
            </div>
        </div>

        <!-- 中間：互動式 K 線與 34MA 圖表 + 亞當理論算頭 -->
        <div class="panel">
            <div class="panel-title" id="chartTitle">
                <i class="fa-solid fa-chart-candlestick"></i> 技術圖表 (34MA 生命線)
            </div>
            
            <div class="chart-container">
                <canvas id="mainChart"></canvas>
            </div>

            <!-- 亞當理論目標價試算器 -->
            <div class="adam-calculator">
                <div style="font-weight: 600; color: var(--accent-yellow); font-size: 0.9rem;">
                    <i class="fa-solid fa-arrows-up-down-left-right"></i> 亞當理論（翻亞當）目標價對稱試算
                </div>
                <div class="adam-inputs">
                    <div class="adam-input-group">
                        <label style="font-size: 0.75rem; color: var(--text-muted);">突破/翻轉點 (A)</label>
                        <input type="number" id="adamA" value="100" oninput="calculateAdam()">
                    </div>
                    <div class="adam-input-group">
                        <label style="font-size: 0.75rem; color: var(--text-muted);">區間高點/低點 (B)</label>
                        <input type="number" id="adamB" value="120" oninput="calculateAdam()">
                    </div>
                    <div class="adam-input-group">
                        <label style="font-size: 0.75rem; color: var(--text-muted);">對稱倍數</label>
                        <input type="number" id="adamRatio" value="1" step="0.5" oninput="calculateAdam()">
                    </div>
                </div>
                <div class="adam-result" id="adamTargetResult">
                    預估翻亞當目標價：140.00 元
                </div>
            </div>
        </div>

        <!-- 右側：雙股票籃 (行進籃 / 盤整籃) -->
        <div class="panel">
            <div class="panel-title"><i class="fa-solid fa-box-archive"></i> 自選追蹤籃</div>
            <div class="basket-container">
                <div class="basket-box">
                    <div class="basket-header">
                        <span><i class="fa-solid fa-person-running" style="color: #26a69a;"></i> 行進籃 (強勢攻勢中)</span>
                        <button style="background:none; border:none; color:var(--text-muted); cursor:pointer;" onclick="addToBasket('行進籃')">+ 加入當前</button>
                    </div>
                    <div id="runningBasket" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
                </div>

                <div class="basket-box">
                    <div class="basket-header">
                        <span><i class="fa-solid fa-pause" style="color: #f59e0b;"></i> 盤整籃 (等待一過二買點)</span>
                        <button style="background:none; border:none; color:var(--text-muted); cursor:pointer;" onclick="addToBasket('盤整籃')">+ 加入當前</button>
                    </div>
                    <div id="consolidationBasket" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 預設 FinMind API Token (使用者已授權)
        const FINMIND_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoiYTA5MjA1NDkxNzVAZ21haWwuY29tIiwiZW1haWwiOiJhMDkyMDU0OTE3NUBnbWFpbC5jb20iLCJ0b2tlbl92ZXJzaW9uIjoxfQ.FhTR6d8coXIfBVM_nAG4AdlTWKqCPDl_ELUewRA3P_w";

        // 預設經典範例資料庫
        let stockDatabase = [
            { id: '2013', name: '中鋼構', pattern: '橫盤整理', price: 62.5, change: '+3.5%' },
            { id: '4721', name: '美琪瑪', pattern: '前高之上', price: 128.0, change: '+5.2%' },
            { id: '6104', name: '創惟', pattern: '橫盤整理', price: 185.5, change: '+1.8%' },
            { id: '2329', name: '華泰', pattern: '前低之上', price: 42.1, change: '-0.5%' }
        ];

        let currentStock = stockDatabase[0];
        let currentFilter = 'all';
        let mainChart = null;

        // 股票籃
        let runningBasket = ['4721 美琪瑪'];
        let consolidationBasket = ['2013 中鋼構', '6104 創惟'];

        // 初始化
        window.onload = function() {
            renderStockList();
            renderBaskets();
            loadStockChartData(currentStock.id);
        };

        // 篩選器切換
        function setPatternFilter(pattern) {
            currentFilter = pattern;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.includes(pattern) || (pattern === 'all' && btn.innerText.includes('全部'))) {
                    btn.classList.add('active');
                }
            });
            renderStockList();
        }

        // 渲染股票清單
        function renderStockList() {
            const listEl = document.getElementById('stockList');
            listEl.innerHTML = '';
            
            const filtered = stockDatabase.filter(item => currentFilter === 'all' || item.pattern === currentFilter);
            
            filtered.forEach(stock => {
                const item = document.createElement('div');
                item.className = `stock-item ${stock.id === currentStock.id ? 'active' : ''}`;
                item.onclick = () => selectStock(stock);
                item.innerHTML = `
                    <div>
                        <div style="font-weight: bold; color: #fff;">${stock.name} (${stock.id})</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">${stock.price} 元</div>
                    </div>
                    <div>
                        <span class="tag tag-pattern">${stock.pattern}</span>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        // 選取股票
        function selectStock(stock) {
            currentStock = stock;
            renderStockList();
            loadStockChartData(stock.id);
        }

        // 從 FinMind API 抓取真實台股資料
        async function fetchLiveStockData() {
            const inputVal = document.getElementById('stockSearchInput').value.trim();
            if (!inputVal) {
                alert('請輸入台股代號！');
                return;
            }

            const stockId = inputVal.split(' ')[0];
            const startDate = '2026-01-01'; // 最新年度數據
            const url = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${stockId}&start_date=${startDate}&token=${FINMIND_TOKEN}`;

            try {
                const response = await fetch(url);
                const result = await response.json();

                if (result.msg === 'success' && result.data.length > 0) {
                    const rawData = result.data;
                    const latest = rawData[rawData.length - 1];
                    
                    // 新增或更新資料庫
                    const newStock = {
                        id: stockId,
                        name: `台股 ${stockId}`,
                        pattern: '橫盤整理', // 預設分析型態
                        price: latest.close,
                        change: '0.0%'
                    };

                    const existingIndex = stockDatabase.findIndex(s => s.id === stockId);
                    if (existingIndex >= 0) {
                        stockDatabase[existingIndex] = newStock;
                    } else {
                        stockDatabase.unshift(newStock);
                    }

                    currentStock = newStock;
                    renderStockList();
                    renderChartWithApiData(rawData, stockId);
                } else {
                    alert(`找不到代號 ${stockId} 的資料，請確認後重試。`);
                }
            } catch (error) {
                console.error(error);
                alert('線上抓取失敗，請檢查網路連線或 API Token。');
            }
        }

        // 計算 34MA 生命線
        function calculateMA(data, period = 34) {
            return data.map((item, index, arr) => {
                if (index < period - 1) return null;
                const slice = arr.slice(index - period + 1, index + 1);
                const sum = slice.reduce((acc, curr) => acc + curr.close, 0);
                return (sum / period).toFixed(2);
            });
        }

        // 渲染 API 即時資料圖表
        function renderChartWithApiData(apiData, stockId) {
            document.getElementById('chartTitle').innerHTML = `<i class="fa-solid fa-chart-candlestick"></i> ${stockId} 即時 K 線與 34MA 生命線`;

            const labels = apiData.map(d => d.date);
            const closePrices = apiData.map(d => d.close);
            const ma34 = calculateMA(apiData, 34);

            drawChart(labels, closePrices, ma34);
            
            // 自動更新亞當計算器初始值
            const lastPrice = closePrices[closePrices.length - 1];
            document.getElementById('adamA').value = lastPrice;
            document.getElementById('adamB').value = (lastPrice * 1.15).toFixed(1);
            calculateAdam();
        }

        // 繪製 Chart.js 視覺化圖表
        function drawChart(labels, closePrices, ma34) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            
            if (mainChart) mainChart.destroy();

            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '收盤價',
                            data: closePrices,
                            borderColor: '#26a69a',
                            borderWidth: 2,
                            tension: 0.1,
                            pointRadius: 2
                        },
                        {
                            label: '34MA 生命線',
                            data: ma34,
                            borderColor: '#ff2e93',
                            borderWidth: 2,
                            borderDash: [4, 4],
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#e2e8f0' } }
                    },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: '#2a3447' } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#2a3447' } }
                    }
                }
            });
        }

        // 模擬數據載入 (對應預設清單)
        function loadStockChartData(stockId) {
            fetchLiveStockData(); // 預設使用即時抓取模式
        }

        // 亞當理論目標價計算
        function calculateAdam() {
            const a = parseFloat(document.getElementById('adamA').value) || 0;
            const b = parseFloat(document.getElementById('adamB').value) || 0;
            const ratio = parseFloat(document.getElementById('adamRatio').value) || 1;

            const target = b + (b - a) * ratio;
            document.getElementById('adamTargetResult').innerText = `預估翻亞當對稱目標價：${target.toFixed(2)} 元`;
        }

        // 加入股票籃
        function addToBasket(type) {
            const itemStr = `${currentStock.id} ${currentStock.name}`;
            if (type === '行進籃' && !runningBasket.includes(itemStr)) {
                runningBasket.push(itemStr);
            } else if (type === '盤整籃' && !consolidationBasket.includes(itemStr)) {
                consolidationBasket.push(itemStr);
            }
            renderBaskets();
        }

        // 渲染股票籃
        function renderBaskets() {
            const runEl = document.getElementById('runningBasket');
            const conEl = document.getElementById('consolidationBasket');

            runEl.innerHTML = runningBasket.map(s => `<span class="tag" style="background: rgba(38,166,154,0.2); color:#26a69a;">${s}</span>`).join('');
            conEl.innerHTML = consolidationBasket.map(s => `<span class="tag" style="background: rgba(245,158,11,0.2); color:#f59e0b;">${s}</span>`).join('');
        }
    </script>
</body>
</html>
