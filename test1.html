<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock From Zero 網頁選股與進出場系統</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-red: #ff5252;
            --accent-green: #4caf50;
            --accent-yellow: #ffeb3b;
            --primary-blue: #2196f3;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Microsoft JhengHei, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: #fff;
            font-size: 1.8rem;
        }

        .strategy-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn:hover, .btn.active {
            background-color: var(--primary-blue);
            color: #fff;
            border-color: var(--primary-blue);
        }

        .btn-fetch {
            background-color: #388e3c;
            color: white;
            border: none;
        }
        
        .btn-fetch:hover {
            background-color: #2e7d32;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1rem;
            color: #aaa;
        }

        .card .value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #252525;
            color: #888;
            font-weight: 600;
        }

        tr:hover {
            background-color: #2a2a2a;
        }

        .tag {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
        }

        .tag-strong { background-color: rgba(76, 175, 80, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .tag-high { background-color: rgba(33, 150, 243, 0.2); color: var(--primary-blue); border: 1px solid var(--primary-blue); }
        .tag-normal { background-color: rgba(255, 235, 59, 0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .tag-weak { background-color: rgba(255, 82, 82, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .price-up { color: var(--accent-red); }   /* 台股習慣：紅漲綠跌 */
        .price-down { color: var(--accent-green); }

        .signal-box {
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .buy-signal { background-color: #b71c1c; color: #fff; }
        .hold-signal { background-color: #f57f17; color: #fff; }
        .sell-signal { background-color: #1b5e20; color: #fff; }

        .param-info {
            font-size: 0.85rem;
            color: #888;
            margin-top: 15px;
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Stock From Zero 選股與進出場決策系統</h1>
        <button class="btn btn-fetch" onclick="fetchStockData()">🔄 偵測最新股票資訊</button>
    </header>

    <!-- 策略切換 -->
    <div class="strategy-selector">
        <button class="btn active" onclick="setStrategy('strong')">電腦選強勢股 (週多排+34MA)</button>
        <button class="btn" onclick="setStrategy('support')">均線支撐股 (55MA支撐)</button>
        <button class="btn" onclick="setStrategy('weak')">弱勢空方股 (34MA向下)</button>
    </div>

    <!-- 儀表板資訊 -->
    <div class="dashboard">
        <div class="card">
            <h3>目前選股策略</h3>
            <div class="value" id="current-strategy-name">電腦選強勢股</div>
        </div>
        <div class="card">
            <h3>符合篩選條件個股</h3>
            <div class="value" id="stock-count">0 檔</div>
        </div>
        <div class="card">
            <h3>建議操作原則</h3>
            <div class="value" style="font-size: 1rem; color: #4fc3f7;">最大持股 ≤ 3檔 | 不追高 | 轉折點進場</div>
        </div>
    </div>

    <!-- 選股結果表格 -->
    <table>
        <thead>
            <tr>
                <th>股票代碼/名稱</th>
                <th>最新收盤價</th>
                <th>5日成交量</th>
                <th>週均線排列</th>
                <th>34MA狀態</th>
                <th>整理型態判斷</th>
                <th>建議進場點 (一過二/轉折)</th>
                <th>建議出場/停損點</th>
                <th>操作訊號</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <!-- 動態渲染選股結果 -->
        </tbody>
    </table>

    <div class="param-info">
        * 系統預設參數：短均線 5 | 中均線 21 | 長均線 89 (週線)；生命線：34MA。<br>
        * 型態強弱等級：橫盤整理 > 在前高上整理 > 在前低上整理 > 跌破前低。
    </div>
</div>

<script>
// 模擬即時股市資料庫 (實際應用可接 Alpha Vantage, FinMind 或台灣證券交易所 API)
const mockMarketData = [
    { code: "2330", name: "台積電", price: 980, ma34: 950, ma34Trend: "up", weekMA: "多頭", vol5d: 125000, pattern: "橫盤整理", breakTwo: true, prevLow: 930 },
    { code: "2013", name: "中鋼構", price: 66.6, ma34: 60.2, ma34Trend: "up", weekMA: "多頭", vol5d: 15000, pattern: "在前高上整理", breakTwo: true, prevLow: 58.0 },
    { code: "3527", name: "聚積", price: 249.0, ma34: 210.0, ma34Trend: "up", weekMA: "多頭", vol5d: 14000, pattern: "橫盤整理", breakTwo: false, prevLow: 230.0 },
    { code: "4721", name: "美琪瑪", price: 136.0, ma34: 115.0, ma34Trend: "up", weekMA: "多頭", vol5d: 61000, pattern: "在前高上整理", breakTwo: true, prevLow: 120.0 },
    { code: "2440", name: "太空梭", price: 16.4, ma34: 17.5, ma34Trend: "down", weekMA: "空頭", vol5d: 1400, pattern: "跌破前低整理", breakTwo: false, prevLow: 17.0 },
    { code: "2317", name: "鴻海", price: 185.0, ma34: 182.0, ma34Trend: "flat", weekMA: "糾結", vol5d: 85000, pattern: "在前低上整理", breakTwo: false, prevLow: 178.0 },
    { code: "3035", name: "智原", price: 310.0, ma34: 335.0, ma34Trend: "down", weekMA: "空頭", vol5d: 22000, pattern: "跌破前低整理", breakTwo: false, prevLow: 320.0 }
];

let currentStrategy = 'strong';

function setStrategy(strategy) {
    currentStrategy = strategy;
    
    // 更新按鈕樣式
    const btns = document.querySelectorAll('.strategy-selector .btn');
    btns.forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    const names = {
        'strong': '電腦選強勢股 (週多排+34MA)',
        'support': '均線支撐股 (55MA支撐)',
        'weak': '弱勢空方股 (34MA向下)'
    };
    document.getElementById('current-strategy-name').innerText = names[strategy];

    filterAndRender();
}

function fetchStockData() {
    alert("已成功連接並偵測最新股票與均線數據！");
    filterAndRender();
}

function filterAndRender() {
    const tbody = document.getElementById('stock-table-body');
    tbody.innerHTML = '';

    let filtered = mockMarketData.filter(stock => {
        if (currentStrategy === 'strong') {
            // 強勢股條件：週多排、收盤>20、收盤>34MA、34MA向上、5日量>10000張
            return stock.weekMA === '多頭' && stock.price >= 20 && stock.price > stock.ma34 && stock.ma34Trend === 'up' && stock.vol5d >= 10000;
        } else if (currentStrategy === 'support') {
            // 均線支撐條件：55MA向上、收盤>55MA、5日量>5000
            return stock.price > stock.ma34 && stock.vol5d >= 5000;
        } else if (currentStrategy === 'weak') {
            // 弱勢股條件：收盤<34MA、34MA向下、價格>50
            return stock.price < stock.ma34 && stock.ma34Trend === 'down' && stock.price >= 50;
        }
        return false;
    });

    document.getElementById('stock-count').innerText = `${filtered.length} 檔`;

    filtered.forEach(stock => {
        let patternTag = '';
        if (stock.pattern === '橫盤整理') patternTag = `<span class="tag tag-strong">1. 橫盤整理 (最強)</span>`;
        else if (stock.pattern === '在前高上整理') patternTag = `<span class="tag tag-high">2. 在前高上整理</span>`;
        else if (stock.pattern === '在前低上整理') patternTag = `<span class="tag tag-normal">3. 在前低上整理</span>`;
        else patternTag = `<span class="tag tag-weak">4. 跌破前低 (避開)</span>`;

        // 進出場點邏輯判定
        let entryPoint = "";
        let exitPoint = "";
        let signal = "";

        if (currentStrategy !== 'weak') {
            entryPoint = stock.breakTwo ? `NT$ ${stock.price} (突破前2日高點起漲)` : `等待壓回不破前高，出現一過二買進`;
            exitPoint = `NT$ ${stock.prevLow} (跌破前低或跌破34MA)`;
            
            if (stock.breakTwo && (stock.pattern === '橫盤整理' || stock.pattern === '在前高上整理')) {
                signal = `<span class="signal-box buy-signal">買進 / 介入點現身</span>`;
            } else {
                signal = `<span class="signal-box hold-signal">觀望 / 等待起漲</span>`;
            }
        } else {
            entryPoint = `NT$ ${stock.price} (股價反彈至34MA受阻)`;
            exitPoint = `NT$ ${stock.ma34} (突破34MA即停損)`;
            signal = `<span class="signal-box sell-signal">空方標的</span>`;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><strong>${stock.code}</strong> ${stock.name}</td>
            <td class="price-up">NT$ ${stock.price}</td>
            <td>${stock.vol5d.toLocaleString()} 張</td>
            <td>${stock.weekMA}</td>
            <td>${stock.ma34Trend === 'up' ? '↗ 向上 (助漲)' : '↘ 向下 (助跌)'}</td>
            <td>${patternTag}</td>
            <td style="color:#4caf50;">${entryPoint}</td>
            <td style="color:#ff5252;">${exitPoint}</td>
            <td>${signal}</td>
        `;
        tbody.appendChild(tr);
    });
}

// 首次載入執行
filterAndRender();
</script>

</body>
</html>
