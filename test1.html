<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock From Zero - 全台股即時選股系統</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-red: #ff5252;
            --accent-green: #4caf50;
            --primary-blue: #2196f3;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Microsoft JhengHei, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; font-size: 1.6rem; color: #fff; }

        .control-panel {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn:hover { background-color: #1976d2; }
        .btn:disabled { background-color: #555; cursor: not-allowed; }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--accent-red);
            transition: width 0.2s;
        }

        .status-bar { font-size: 0.95rem; color: #aaa; margin-top: 5px; }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .card h3 { margin: 0 0 8px 0; font-size: 0.85rem; color: #aaa; }
        .card .value { font-size: 1.4rem; font-weight: bold; }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        th, td {
            padding: 12px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th { background-color: #252525; color: #999; font-weight: 600; }
        tr:hover { background-color: #2a2a2a; }

        .tag {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }

        .tag-strong { background-color: rgba(76, 175, 80, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .tag-high { background-color: rgba(33, 150, 243, 0.2); color: var(--primary-blue); border: 1px solid var(--primary-blue); }
        .tag-normal { background-color: rgba(255, 235, 59, 0.2); color: #ffeb3b; border: 1px solid #ffeb3b; }

        .price-red { color: var(--accent-red); font-weight: bold; }

        .signal-buy { background-color: #b71c1c; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        .signal-wait { background-color: #f57f17; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Stock From Zero - 全台股自動檢測選股系統</h1>
    </header>

    <div class="control-panel">
        <button id="scan-btn" class="btn" onclick="startFullMarketScan()">🚀 執行全台股（所有股票）即時掃描</button>
        <div class="status-bar" id="status-text">準備就緒，請點擊按鈕獲取全市場最新真實行情...</div>
        <div class="progress-bar-container" id="pbar-box">
            <div class="progress-bar" id="pbar"></div>
        </div>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>全市場掃描總檔數</h3>
            <div class="value" id="scanned-count">0 檔</div>
        </div>
        <div class="card">
            <h3>流動性初篩符合檔數</h3>
            <div class="value" id="filtered-count" style="color:#2196f3;">0 檔</div>
        </div>
        <div class="card">
            <h3>入選強勢股股票籃</h3>
            <div class="value" id="matched-count" style="color: var(--accent-red);">0 檔</div>
        </div>
        <div class="card">
            <h3>建議操作原則</h3>
            <div class="value" style="color: #4fc3f7; font-size:1.1rem;">同時持股 ≤ 3 檔</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>股票代碼 / 名稱</th>
                <th>最新收盤價</th>
                <th>34日 MA (生命線)</th>
                <th>34MA 趨勢</th>
                <th>近5日總成交量</th>
                <th>講義整理型態</th>
                <th>建議進場點 (一過二)</th>
                <th>建議停損/出場點</th>
                <th>操作訊號</th>
            </tr>
        </thead>
        <tbody id="stock-table-body">
            <tr>
                <td colspan="9" style="text-align: center; color: #666; padding: 30px;">
                    點擊「執行全台股即時掃描」後，系統將自動從公開數據接口下載全市場最新股票進行條件判斷。
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
async function startFullMarketScan() {
    const btn = document.getElementById('scan-btn');
    const status = document.getElementById('status-text');
    const pbarBox = document.getElementById('pbar-box');
    const pbar = document.getElementById('pbar');
    const tbody = document.getElementById('stock-table-body');

    btn.disabled = true;
    tbody.innerHTML = '';
    pbarBox.style.display = 'block';
    pbar.style.width = '0%';

    try {
        status.innerText = "【1/3】正在拉取全台股最新每日收盤行情大盤清單...";
        
        // 使用 FinMind API 獲取全市場股票大盤日線數據
        const endDate = new Date().toISOString().split('T')[0];
        const startDateObj = new Date();
        startDateObj.setDate(startDateObj.getDate() - 90); // 獲取近 90 天數據以精確計算 34MA
        const startDate = startDateObj.toISOString().split('T')[0];

        // 1. 取得全台股最新主要個股清單與近期價格數據
        // 為了確保全市場覆蓋且快速檢測，系統採用多線程批次解析
        const listRes = await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInfo`);
        const listData = await listRes.json();
        
        // 過濾僅保留一般上市櫃普通股 (代碼為4碼數字)
        const allStocks = listData.data.filter(s => s.stock_id.length === 4 && !isNaN(s.stock_id));
        document.getElementById('scanned-count').innerText = `${allStocks.length} 檔`;

        status.innerText = `【2/3】成功載入 ${allStocks.length} 檔股票，開始全市場分析檢測...`;

        let matchedCount = 0;
        let processed = 0;

        // 批次掃描邏輯 (為維持穩定與流暢，採用高效率多線程並行處理)
        const batchSize = 10;
        for (let i = 0; i < allStocks.length; i += batchSize) {
            const batch = allStocks.slice(i, i + batchSize);
            
            await Promise.all(batch.map(async (stock) => {
                try {
                    const priceUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${stock.stock_id}&start_date=${startDate}&end_date=${endDate}`;
                    const pRes = await fetch(priceUrl);
                    const pData = await pRes.json();

                    if (pData.data && pData.data.length >= 40) {
                        const prices = pData.data;
                        const len = prices.length;

                        const latest = prices[len - 1];
                        const prev1 = prices[len - 2];
                        const prev2 = prices[len - 3];

                        // 條件 1：股價 > 20 元
                        if (latest.Close < 20) return;

                        // 條件 2：5 日累積成交量 > 10,000 張 (計算單位換算)
                        const vol5d = Math.round(prices.slice(len - 5, len).reduce((a, b) => a + (b.Trading_Volume || 0), 0) / 1000);
                        if (vol5d < 10000) return;

                        // 條件 3 & 4：計算 34MA 並確認 34MA 上揚 (生命線)
                        const ma34Current = prices.slice(len - 34, len).reduce((a, b) => a + b.Close, 0) / 34;
                        const ma34Prev = prices.slice(len - 39, len - 5).reduce((a, b) => a + b.Close, 0) / 34;
                        
                        const isAboveMa34 = latest.Close > ma34Current;
                        const isMa34Up = ma34Current > ma34Prev;

                        // 符合講義強勢條件：股價 > 34MA 且 34MA 向上
                        if (isAboveMa34 && isMa34Up) {
                            matchedCount++;

                            // 檢查「一過二」(收盤價突破前兩日最高點)
                            const prev2MaxHigh = Math.max(prev1.Max, prev2.Max);
                            const isBreakTwo = latest.Close > prev2MaxHigh;

                            // 計算近 15 日最高與最低 (判定 4 種整理型態)
                            const highest15 = Math.max(...prices.slice(len - 15, len - 1).map(p => p.Max));
                            const lowest15 = Math.min(...prices.slice(len - 15, len - 1).map(p => p.Min));

                            let patternType = "3. 前低上整理";
                            if (latest.Close >= highest15) patternType = "1. 橫盤整理 (最強)";
                            else if (latest.Close > (highest15 + lowest15) / 2) patternType = "2. 前高上整理";

                            renderRow({
                                code: stock.stock_id,
                                name: stock.stock_name,
                                close: latest.Close,
                                ma34: ma34Current.toFixed(1),
                                isMa34Up: isMa34Up,
                                vol5d: vol5d,
                                pattern: patternType,
                                isBreakTwo: isBreakTwo,
                                prevLow: lowest15
                            });

                            document.getElementById('matched-count').innerText = `${matchedCount} 檔`;
                        }
                    }
                } catch (e) {
                    // 忽略個別請求異常，確保全市場持續掃描
                }
            }));

            processed += batch.length;
            const progress = Math.min(100, Math.round((processed / allStocks.length) * 100));
            pbar.style.width = `${progress}%`;
            status.innerText = `【3/3】全市場檢測中 (${processed} / ${allStocks.length} 檔) - 已找到 ${matchedCount} 檔強勢股...`;
        }

        status.innerText = `✅ 全市場掃描完畢！共掃描 ${allStocks.length} 檔股票，已成功挑選出符合講義條件的股票！`;
    } catch (err) {
        console.error(err);
        status.innerText = "掃描過程中發生錯誤，請重新試驗或檢查網路連線。";
    } finally {
        btn.disabled = false;
    }
}

function renderRow(s) {
    const tbody = document.getElementById('stock-table-body');
    const tr = document.createElement('tr');

    let patternTag = "";
    if (s.pattern.includes("1.")) patternTag = `<span class="tag tag-strong">${s.pattern}</span>`;
    else if (s.pattern.includes("2.")) patternTag = `<span class="tag tag-high">${s.pattern}</span>`;
    else patternTag = `<span class="tag tag-normal">${s.pattern}</span>`;

    let signal = "";
    if (s.isBreakTwo) {
        signal = `<span class="signal-buy">起漲進場點 (一過二)</span>`;
    } else {
        signal = `<span class="signal-wait">多頭觀望 (等待突破前2日高點)</span>`;
    }

    tr.innerHTML = `
        <td><strong>${s.code}</strong> ${s.name}</td>
        <td class="price-red">NT$ ${s.close}</td>
        <td>NT$ ${s.ma34}</td>
        <td style="color: ${s.isMa34Up ? '#ff5252' : '#4caf50'};">${s.isMa34Up ? '↗ 上揚 (助漲)' : '↘ 下彎'}</td>
        <td>${s.vol5d.toLocaleString()} 張</td>
        <td>${patternTag}</td>
        <td style="color: #ff5252;">${s.isBreakTwo ? `NT$ ${s.close} (突破起漲)` : '等待突破前2日最高價'}</td>
        <td style="color: #4caf50;">NT$ ${Math.min(s.prevLow, parseFloat(s.ma34)).toFixed(1)} (跌破前低/34MA)</td>
        <td>${signal}</td>
    `;
    tbody.appendChild(tr);
}
</script>

</body>
</html>
